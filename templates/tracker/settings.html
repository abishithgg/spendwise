<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | SpendWise</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f5f7fb;
            color: #172033;
        }

        .container {
            max-width: 700px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .back {
            color: #4f46e5;
            text-decoration: none;
            font-weight: 600;
        }

        .card {
            background: white;
            margin-top: 22px;
            padding: 32px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.07);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 30px;
        }

        .setting {
            padding: 18px 0;
            border-bottom: 1px solid #eee;
        }

        .setting:last-child {
            border-bottom: none;
        }

        .setting-title {
            font-weight: 700;
            margin-bottom: 5px;
        }

        .setting-text {
            color: #6b7280;
            font-size: 14px;
        }

        .logout {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 18px;
            border-radius: 10px;
            background: #dc2626;
            color: white;
            text-decoration: none;
            font-weight: 600;
        }

        .logout:hover {
            background: #b91c1c;
        }
    </style>
</head>

<body>

<div class="container">

    <a href="{% url 'dashboard' %}" class="back">
        ← Back to Dashboard
    </a>

    <div class="card">

        <h1>Settings</h1>

        <p class="subtitle">
            Manage your SpendWise account.
        </p>

        <div class="setting">
            <div class="setting-title">
                Account
            </div>

            <div class="setting-text">
                You are logged in as {{ request.user.username }}.
            </div>
        </div>

        <div class="setting">
            <div class="setting-title">
                Email
            </div>

            <div class="setting-text">
                {{ request.user.email|default:"No email added" }}
            </div>
        </div>

        <div class="setting">
            <div class="setting-title">
                Data
            </div>

            <div class="setting-text">
                Your expenses, income and budgets are stored in your SpendWise account.
            </div>
        </div>

        <a href="{% url 'logout' %}" class="logout">
            Log Out
        </a>

    </div>

</div>

</body>
</html>
